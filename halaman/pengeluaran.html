<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Pengeluaran</title>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-button" aria-label="Buka atau tutup menu">
        <span>☰</span>
    </label>

    <!--Sidebar-->
    <aside class="sidebar">
        <h2>DOFTECH CASH</h2>

        <nav>
            <ul>
                <li><a href="../index.html"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
                <li><a href="siswa.html"><i class="fa-solid fa-users"></i><span>Daftar Siswa</span></a></li>
                <li><a href="pemasukan.html"><i class="fa-solid fa-money-bill-trend-up"></i><span>Pemasukan</span></a></li>
                <li><a href="pengeluaran.html"><i class="fa-solid fa-money-bill-transfer"></i><span>Pengeluaran</span></a></li>
            </ul>
        </nav>
    </aside>

    <label for="menu-toggle" class="menu-overlay" aria-label="Tutup menu"></label>

    <!--Content-->
    <main class="content">

    <div class="header">

        <div>
            <h1>Pengeluaran</h1>
            <p>Cek seluruh pengeluaran kas.</p>
        </div>

         <div class="header-action">
            <button class="add-btn" onclick="tampilkanForm()">
                + Tambah Pengeluaran
            </button>
        </div>
    </div>

    <!--Form pengeluaran-->
<div class="form-pengeluaran" id="formPengeluaran">

    <h2>Tambah Pengeluaran</h2>

    <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="tanggal">
    </div>

    <div class="form-group">
        <label>Keterangan</label>
        <input type="text" id="keterangan" placeholder="Contoh: kas kelas">
    </div>

    <div class="form-group">
        <label>Kategori</label>

        <select id="kategori">
            <option value="">Pilih Kategori</option>
            <option value="ATK/Perlengkapan">ATK/Perlengkapan</option>
            <option value="Kegiatan">Kegiatan</option>
            <option value="Konsumsi">Konsumsi</option>
            <option value="Lainnya">Lainnya</option>
        </select>

    </div>

    <div class="form-group">
        <label>Jumlah</label>
        <input type="text" id="jumlah" placeholder="Contoh: 150000">
    </div>

    <div class="form-group">
        <label>Catatan</label>
        <input
            type="text"
            id="catatan"
            placeholder="Pembelian .... untuk kegiatan kelas">
    </div>

    <div class="form-action">

        <button
            class="batal-btn"
            onclick="tutupForm()">
            Batal
        </button>

        <button
            class="simpan-btn"
            onclick="simpanPengeluaran()">
            Simpan
        </button>

    </div>

</div>
    

    <!--Ringkasan-->
    <div class="income-cards">
        
        <div class="income-card">
            <h3>Total Pengeluaran</h3>
            <p id="totalPengeluaran">Rp0</p>
        </div>

        <div class="income-card">
            <h3>Jumlah Transaksi</h3>
            <p id="jumlahTransaksi">0 Transaksi</p>
        </div>

    </div>

    <!--Search dan filter box-->
    <div class="filter-box">

        <input type="text" id="cariPengeluaran" placeholder="🔍  Cari Pengeluaran...">

        <select id="filterKategoriPengeluaran">
            <option value="">All</option>
            <option>ATK/Perlengkapan</option>
            <option>Kegiatan</option>
            <option>Konsumsi</option>
            <option>Lainnya</option>
        </select>
    </div>

    <!--Tabel pemasukan-->
    <div class="income-table">

        <div class="income-table-header">
            <h2>Riwayat Pengeluaran</h2>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Keterangan</th>
                    <th>Kategori</th>
                    <th>Jumlah</th>
                    <th>Catatan</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="tabelPengeluaran">
            </tbody>
        </table>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/pengeluaran.js"></script>
</body>
</html>
